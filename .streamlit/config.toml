[client]
showErrorDetails = "full"
toolbarMode = "minimal"

[theme]
primaryColor = "#1f4e78"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f8"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
fileWatcherType = "auto"
runOnSave = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[browser]
gatherUsageStats = false
